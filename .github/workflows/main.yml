name: Build Vault Calc APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/faizantedwa/vaultcalc
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html
          cp app.js app/src/main/assets/app.js
          cp styles.css app/src/main/assets/styles.css

          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/drawable/app_icon.png
            ICON_LINE='android:icon="@drawable/app_icon"'
          else
            ICON_LINE=''
          fi


          cat > settings.gradle <<'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaultCalc"
          include(":app")
          SETTINGS_EOF


          cat > build.gradle <<'ROOT_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          ROOT_EOF


          cat > app/build.gradle <<'APP_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.faizantedwa.vaultcalc'
              compileSdk 35

              defaultConfig {
                  applicationId "com.faizantedwa.vaultcalc"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          APP_EOF


          cat > app/src/main/res/values/styles.xml <<'STYLE_EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
              </style>
          </resources>
          STYLE_EOF


          cat > app/src/main/AndroidManifest.xml <<MANIFEST_EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Vault Calc"
                  $ICON_LINE
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          MANIFEST_EOF


          cat > app/src/main/java/com/faizantedwa/vaultcalc/MainActivity.java <<'JAVA_EOF'
          package com.faizantedwa.vaultcalc;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.util.Base64;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_REQUEST = 1001;
              private static final int DELETE_REQUEST = 2001;

              private final ArrayList<Uri> selectedUris =
                      new ArrayList<>();


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.addJavascriptInterface(
                          new VaultBridge(),
                          "VaultAndroid"
                  );


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (fileCallback != null) {
                                      fileCallback.onReceiveValue(null);
                                  }

                                  fileCallback = callback;
                                  selectedUris.clear();

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                          );

                                  intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                  );

                                  intent.setType("image/*");

                                  intent.putExtra(
                                          Intent.EXTRA_ALLOW_MULTIPLE,
                                          true
                                  );

                                  try {

                                      startActivityForResult(
                                              intent,
                                              FILE_REQUEST
                                      );

                                      return true;

                                  } catch (Exception e) {

                                      fileCallback = null;
                                      return false;
                                  }
                              }
                          }
                  );


                  setContentView(webView);

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }


              @Override
              public void onBackPressed() {

                  if (webView != null) {

                      webView.evaluateJavascript(
                              "if(window.handleAndroidBack){" +
                              "window.handleAndroidBack();" +
                              "}",
                              null
                      );

                  } else {

                      super.onBackPressed();
                  }
              }


              @Override
              protected
