name: Build Vault Calc APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/faizantedwa/vaultcalc
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html
          cp app.js app/src/main/assets/app.js
          cp styles.css app/src/main/assets/styles.css

          # Custom app icon
          cp icon.png app/src/main/res/drawable/app_icon.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaultCalc"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.faizantedwa.vaultcalc'
              compileSdk 35

              defaultConfig {
                  applicationId "com.faizantedwa.vaultcalc"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Vault Calc"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/faizantedwa/vaultcalc/MainActivity.java <<'EOF'
          package com.faizantedwa.vaultcalc;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(
                                      intent,
                                      FILE_REQUEST
                              );
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                      }
                  });

                  setContentView(webView);

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode != FILE_REQUEST) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK && data != null) {

                      if (data.getClipData() != null) {

                          int count =
                                  data.getClipData().getItemCount();

                          results = new Uri[count];

                          for (int i = 0; i < count; i++) {
                              results[i] =
                                      data.getClipData()
                                              .getItemAt(i)
                                              .getUri();
                          }

                      } else if (data.getData() != null) {

                          results = new Uri[] {
                                  data.getData()
                          };
                      }
                  }

                  if (fileCallback != null) {
                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }
          }
          EOF

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultCalc-APK
          path: app/build/outputs/apk/debug/app-debug.apk
