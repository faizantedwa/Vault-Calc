name: Build Vault Calc APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/faizantedwa/vaultcalc
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html
          cp app.js app/src/main/assets/app.js
          cp styles.css app/src/main/assets/styles.css

          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/drawable/app_icon.png
            ICON_LINE='android:icon="@drawable/app_icon"'
          else
            ICON_LINE=''
          fi

          cat > settings.gradle <<'SETTINGS_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaultCalc"
          include(":app")
          SETTINGS_END

          cat > build.gradle <<'ROOT_END'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          ROOT_END

          cat > app/build.gradle <<'APP_END'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.faizantedwa.vaultcalc'
              compileSdk 35

              defaultConfig {
                  applicationId "com.faizantedwa.vaultcalc"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          APP_END

          cat > app/src/main/res/values/styles.xml <<'STYLE_END'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
              </style>
          </resources>
          STYLE_END

          cat > app/src/main/AndroidManifest.xml <<MANIFEST_END
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Vault Calc"
                  $ICON_LINE
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          MANIFEST_END

          cat > app/src/main/java/com/faizantedwa/vaultcalc/MainActivity.java <<'JAVA_END'
          package com.faizantedwa.vaultcalc;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.os.Bundle;
          import android.os.Build;

          import android.content.Intent;
          import android.net.Uri;

          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import android.util.Base64;

          import java.io.File;
          import java.io.FileOutputStream;

          import java.util.ArrayList;


          public class MainActivity extends Activity {

              private WebView webView;

              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_REQUEST = 1001;

              private static final int DELETE_REQUEST = 2001;

              private final ArrayList<Uri> selectedUris =
                      new ArrayList<>();


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(
                          new WebViewClient()
                  );

                  webView.addJavascriptInterface(
                          new VaultBridge(),
                          "VaultAndroid"
                  );

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (fileCallback != null) {
                                      fileCallback.onReceiveValue(null);
                                  }

                                  fileCallback = callback;
                                  selectedUris.clear();

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                          );

                                  intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                  );

                                  intent.setType("image/*");

                                  intent.putExtra(
                                          Intent.EXTRA_ALLOW_MULTIPLE,
                                          true
                                  );

                                  try {

                                      startActivityForResult(
                                              intent,
                                              FILE_REQUEST
                                      );

                                      return true;

                                  } catch (Exception e) {

                                      fileCallback = null;
                                      return false;
                                  }
                              }
                          }
                  );

                  setContentView(webView);

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }


              @Override
              public void onBackPressed() {

                  if (webView != null) {

                      webView.evaluateJavascript(
                              "if(window.handleAndroidBack){" +
                              "window.handleAndroidBack();" +
                              "}",
                              null
                      );

                  } else {

                      super.onBackPressed();
                  }
              }


              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode == FILE_REQUEST) {

                      Uri[] results = null;

                      if (
                              resultCode == RESULT_OK &&
                              data != null
                      ) {

                          if (data.getClipData() != null) {

                              int count =
                                      data.getClipData()
                                              .getItemCount();

                              results =
                                      new Uri[count];

                              for (
                                      int i = 0;
                                      i < count;
                                      i++
                              ) {

                                  Uri uri =
                                          data.getClipData()
                                                  .getItemAt(i)
                                                  .getUri();

                                  selectedUris.add(uri);

                                  results[i] = uri;
                              }

                          } else if (data.getData() != null) {

                              Uri uri =
                                      data.getData();

                              selectedUris.add(uri);

                              results =
                                      new Uri[]{uri};
                          }
                      }

                      if (fileCallback != null) {

                          fileCallback.onReceiveValue(results);

                          fileCallback = null;
                      }
                  }

                  if (requestCode == DELETE_REQUEST) {

                      selectedUris.clear();
                  }
              }


              public class VaultBridge {


                  @JavascriptInterface
                  public String savePrivatePhoto(
                          String dataUrl,
                          String originalName) {

                      try {

                          if (
                                  dataUrl == null ||
                                  !dataUrl.contains(",")
                          ) {
                              return "";
                          }

                          String base64 =
                                  dataUrl.substring(
                                          dataUrl.indexOf(",") + 1
                                  );

                          byte[] bytes =
                                  Base64.decode(
                                          base64,
                                          Base64.DEFAULT
                                  );

                          File folder =
                                  new File(
                                          getFilesDir(),
                                          "vault_photos"
                                  );

                          if (!folder.exists()) {
                              folder.mkdirs();
                          }

                          String name =
                                  originalName == null
                                          ? "photo"
                                          : originalName;

                          String safeName =
                                  "vault_" +
                                  System.currentTimeMillis() +
                                  "_" +
                                  Math.abs(name.hashCode()) +
                                  ".jpg";

                          File output =
                                  new File(
                                          folder,
                                          safeName
                                  );

                          FileOutputStream fos =
                                  new FileOutputStream(output);

                          fos.write(bytes);
                          fos.flush();
                          fos.close();

                          return output.toURI().toString();

                      } catch (Exception e) {

                          return "";
                      }
                  }


                  @JavascriptInterface
                  public void deleteVaultPhoto(
                          String path) {

                      try {

                          if (path == null) {
                              return;
                          }

                          if (path.startsWith("file:")) {

                              Uri uri =
                                      Uri.parse(path);

                              String filePath =
                                      uri.getPath();

                              if (filePath != null) {

                                  File file =
                                          new File(filePath);

                                  if (file.exists()) {
                                      file.delete();
                                  }
                              }
                          }

                      } catch (Exception e) {
                      }
                  }


                  /*
                   * RESTORE PRIVATE PHOTO
                   *
                   * This creates a copy of the private photo
                   * back in the Gallery.
                   */

                  @JavascriptInterface
                  public String restorePrivatePhoto(
                          String path,
                          String originalName) {

                      try {

                          if (
                                  path == null ||
                                  !path.startsWith("file:")
                          ) {
                              return "";
                          }

                          Uri uri =
                                  Uri.parse(path);

                          String filePath =
                                  uri.getPath();

                          if (filePath == null) {
                              return "";
                          }

                          File source =
                                  new File(filePath);

                          if (!source.exists()) {
                              return "";
                          }


                          /*
                           * Android 10+
                           */

                          if (
                                  Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.Q
                          ) {

                              android.content.ContentValues values =
                                      new android.content.ContentValues();

                              String name =
                                      "Restored_" +
                                      System.currentTimeMillis() +
                                      "_" +
                                      cleanName(originalName);

                              values.put(
                                      android.provider.MediaStore.Images.Media.DISPLAY_NAME,
                                      name
                              );

                              values.put(
                                      android.provider.MediaStore.Images.Media.MIME_TYPE,
                                      "image/jpeg"
                              );

                              values.put(
                                      android.provider.MediaStore.Images.Media.RELATIVE_PATH,
                                      android.os.Environment.DIRECTORY_PICTURES +
                                      "/Vault Calc"
                              );

                              Uri destination =
                                      getContentResolver().insert(
                                              android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                              values
                                      );

                              if (destination == null) {
                                  return "";
                              }

                              java.io.OutputStream output =
                                      getContentResolver()
                                              .openOutputStream(
                                                      destination
                                              );

                              if (output == null) {

                                  getContentResolver().delete(
                                          destination,
                                          null,
                                          null
                                  );

                                  return "";
                              }

                              FileInputStreamWrapper(
                                      source,
                                      output
                              );

                              output.close();

                              return "OK";
                          }


                          /*
                           * Older Android
                           */

                          android.graphics.Bitmap bitmap =
                                  android.graphics.BitmapFactory
                                          .decodeFile(
                                                  source.getAbsolutePath()
                                          );

                          if (bitmap == null) {
                              return "";
                          }

                          String name =
                                  "Restored_" +
                                  System.currentTimeMillis() +
                                  "_" +
                                  cleanName(originalName);

                          String result =
                                  android.provider.MediaStore.Images.Media
                                          .insertImage(
                                                  getContentResolver(),
                                                  bitmap,
                                                  name,
                                                  "Restored from Vault Calc"
                                          );

                          bitmap.recycle();

                          if (result == null) {
                              return "";
                          }

                          return "OK";

                      } catch (Exception e) {

                          return "";
                      }
                  }


                  private void FileInputStreamWrapper(
                          File source,
                          java.io.OutputStream output)
                          throws Exception {

                      java.io.FileInputStream input =
                              new java.io.FileInputStream(source);

                      byte[] buffer =
                              new byte[8192];

                      int length;

                      while (
                              (length = input.read(buffer)) > 0
                      ) {

                          output.write(
                                  buffer,
                                  0,
                                  length
                          );
                      }

                      output.flush();
                      input.close();
                  }


                  private String cleanName(String name) {

                      if (
                              name == null ||
                              name.length() == 0
                      ) {
                          return "photo.jpg";
                      }

                      String clean =
                              name.replaceAll(
                                      "[^a-zA-Z0-9._-]",
                                      "_"
                              );

                      return clean;
                  }


                  /*
                   * REMOVE ORIGINAL PHOTOS
                   *
                   * Android 11+ shows the official Android
                   * confirmation dialog before deleting.
                   */

                  @JavascriptInterface
                  public void requestMoveToVault() {

                      if (selectedUris.isEmpty()) {
                          return;
                      }

                      ArrayList<Uri> uris =
                              new ArrayList<>(
                                      selectedUris
                              );

                      if (
                              Build.VERSION.SDK_INT >=
                              Build.VERSION_CODES.R
                      ) {

                          try {

                              PendingIntent pendingIntent =
                                      android.provider.MediaStore
                                              .createDeleteRequest(
                                                      getContentResolver(),
                                                      uris
                                              );

                              startIntentSenderForResult(
                                      pendingIntent.getIntentSender(),
                                      DELETE_REQUEST,
                                      null,
                                      0,
                                      0,
                                      0
                              );

                          } catch (Exception e) {
                          }

                          return;
                      }

                      for (Uri uri : uris) {

                          try {

                              getContentResolver()
                                      .delete(
                                              uri,
                                              null,
                                              null
                                      );

                          } catch (Exception e) {
                          }
                      }

                      selectedUris.clear();
                  }


                  @JavascriptInterface
                  public void setCurrentScreen(
                          String screen) {
                  }


                  @JavascriptInterface
                  public void finishApp() {

                      runOnUiThread(
                              new Runnable() {

                                  @Override
                                  public void run() {
                                      finish();
                                  }
                              }
                      );
                  }
              }
          }
          JAVA_END


      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/faizantedwa/vaultcalc/MainActivity.java

          echo "Project files OK"


      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "Checking APK output..."

          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK FOUND SUCCESSFULLY!"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultCalc-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
