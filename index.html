<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vault Calc</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <!-- =========================
         CALCULATOR
    ========================== -->

    <section
        id="screen-calculator"
        class="screen"
    >

        <div class="calculator">

            <div
                id="display"
                class="display"
            >0</div>

            <div class="calculator-grid">

                <button
                    class="key"
                    data-k="C"
                >C</button>

                <button
                    class="key"
                    data-k="("
                >(</button>

                <button
                    class="key"
                    data-k=")"
                >)</button>

                <button
                    class="key"
                    data-k="÷"
                >÷</button>


                <button
                    class="key"
                    data-k="7"
                >7</button>

                <button
                    class="key"
                    data-k="8"
                >8</button>

                <button
                    class="key"
                    data-k="9"
                >9</button>

                <button
                    class="key"
                    data-k="×"
                >×</button>


                <button
                    class="key"
                    data-k="4"
                >4</button>

                <button
                    class="key"
                    data-k="5"
                >5</button>

                <button
                    class="key"
                    data-k="6"
                >6</button>

                <button
                    class="key"
                    data-k="−"
                >−</button>


                <button
                    class="key"
                    data-k="1"
                >1</button>

                <button
                    class="key"
                    data-k="2"
                >2</button>

                <button
                    class="key"
                    data-k="3"
                >3</button>

                <button
                    class="key"
                    data-k="+"
                >+</button>


                <button
                    class="key zero"
                    data-k="0"
                >0</button>

                <button
                    class="key"
                    data-k="."
                >.</button>

                <button
                    class="key"
                    data-k="⌫"
                >⌫</button>

                <button
                    class="key equal"
                    data-k="="
                >=</button>

            </div>


            <div class="calculator-actions">

                <button
                    id="btn-history"
                    class="secondary-button"
                >
                    HISTORY
                </button>

            </div>

        </div>


        <!-- SMALL VAULT BUTTON -->

        <button
            id="btn-vault"
            class="small-vault-button"
        >
            🔐 Vault
        </button>

    </section>


    <!-- =========================
         HISTORY
    ========================== -->

    <section
        id="screen-history"
        class="screen hidden"
    >

        <div class="page">

            <h2>History</h2>

            <div
                id="history-list"
                class="history-list"
            ></div>

            <button
                id="btn-clear-history"
                class="danger-button"
            >
                CLEAR HISTORY
            </button>

            <button
                id="btn-back-calc"
                class="back-button"
            >
                ← BACK
            </button>

        </div>

    </section>


    <!-- =========================
         LOGIN / PIN
    ========================== -->

    <section
        id="screen-login"
        class="screen hidden"
    >

        <div class="page login-page">

            <h2>Private Vault</h2>

            <div
                id="login-msg"
                class="message"
            ></div>

            <input
                id="pin-input"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Enter PIN"
            >

            <button
                id="btn-open"
                class="primary-button"
            >
                🔓 OPEN VAULT
            </button>

            <button
                id="btn-back-login"
                class="back-button"
            >
                ← BACK
            </button>

        </div>

    </section>


    <!-- =========================
         VAULT
    ========================== -->

    <section
        id="screen-vault"
        class="screen hidden"
    >

        <div class="page vault-page">

            <div class="vault-header">

                <h2>Private Vault</h2>

                <button
                    id="btn-lock"
                    class="small-button"
                >
                    LOCK
                </button>

            </div>


            <div class="vault-actions">

                <button
                    id="btn-add"
                    class="primary-button"
                >
                    ＋ ADD PHOTOS
                </button>

                <button
                    id="btn-change-pin"
                    class="secondary-button"
                >
                    CHANGE PIN
                </button>

            </div>


            <input
                id="file-input"
                type="file"
                accept="image/*"
                multiple
                hidden
            >


            <div
                id="vault-grid"
                class="vault-grid"
            ></div>


            <button
                id="btn-back-vault"
                class="back-button"
            >
                ← BACK
            </button>

        </div>

    </section>


    <!-- =========================
         CHANGE PIN
    ========================== -->

    <section
        id="screen-changepin"
        class="screen hidden"
    >

        <div class="page">

            <h2>Change PIN</h2>

            <div
                id="cp-msg"
                class="message"
            ></div>

            <input
                id="cp-old"
                type="password"
                inputmode="numeric"
                placeholder="Current PIN"
            >

            <input
                id="cp-new"
                type="password"
                inputmode="numeric"
                placeholder="New PIN"
            >

            <input
                id="cp-confirm"
                type="password"
                inputmode="numeric"
                placeholder="Confirm New PIN"
            >

            <button
                id="btn-save-pin"
                class="primary-button"
            >
                SAVE PIN
            </button>

            <button
                id="btn-back-vault"
                class="back-button"
            >
                ← BACK
            </button>

        </div>

    </section>


    <!-- =========================
         FULL PHOTO
    ========================== -->

    <section
        id="screen-photo"
        class="screen hidden"
    >

        <div class="photo-viewer">

            <img
                id="photo-full"
                alt="Private photo"
            >

            <div class="photo-viewer-actions">

                <button
                    id="btn-restore"
                    class="primary-button"
                >
                    ♻ RESTORE TO GALLERY
                </button>

                <button
                    id="btn-delete-photo"
                    class="danger-button"
                >
                    DELETE FROM VAULT
                </button>

                <button
                    id="btn-photo-back"
                    class="back-button"
                >
                    ← BACK
                </button>

            </div>

        </div>

    </section>


    <script src="app.js"></script>

</body>

                  </html>
